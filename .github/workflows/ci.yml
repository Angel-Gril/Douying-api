name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium for UI tests
        run: playwright install --with-deps chromium
      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          /usr/bin/ffmpeg -version
      - name: Compile Python modules
        run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Workers deployment package
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.151.1 --cwd cloudflare deploy --dry-run --outdir .dry-run
      - name: Run tests
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: python -m pytest -q
